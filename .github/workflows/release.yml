name: Build desktop releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.artifact_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: ReTrack-Windows
            archive_name: ReTrack-Windows-Setup.exe
            dist_path: dist/ReTrack.exe
          - os: ubuntu-latest
            artifact_name: ReTrack-Linux
            archive_name: ReTrack-Linux.deb
            dist_path: dist/ReTrack
          - os: macos-latest
            artifact_name: ReTrack-macOS
            archive_name: ReTrack-macOS.dmg
            dist_path: dist/ReTrack.app

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip

      - name: Install Linux desktop build packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build ReTrack
        env:
          RETRACK_BUNDLE_ENV: "0"
        run: pyinstaller --noconfirm --clean ReTrack.spec

      - name: Install Windows installer tooling
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Package Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if ("${{ github.ref_type }}" -eq "tag") {
            $env:RETRACK_VERSION = "${{ github.ref_name }}".TrimStart("v")
          } else {
            $env:RETRACK_VERSION = "0.0.0"
          }
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc "packaging\windows\ReTrack.iss"
          if (!(Test-Path "${{ matrix.archive_name }}")) {
            throw "Windows installer was not created."
          }

      - name: Package Linux deb installer
        if: runner.os == 'Linux'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "$VERSION" = "$GITHUB_REF_NAME" ]; then VERSION="0.0.0"; fi
          chmod +x "${{ matrix.dist_path }}"
          mkdir -p package/DEBIAN package/opt/retrack package/usr/local/bin package/usr/share/applications
          cp "${{ matrix.dist_path }}" package/opt/retrack/ReTrack
          ln -s /opt/retrack/ReTrack package/usr/local/bin/retrack
          cat > package/DEBIAN/control <<EOF
          Package: retrack
          Version: ${VERSION}
          Section: science
          Priority: optional
          Architecture: amd64
          Maintainer: BIOTRACKERS <support@example.com>
          Depends: libgtk-3-0, libwebkit2gtk-4.1-0
          Description: ReTrack IMU rehabilitation tracking desktop app
           ReTrack records and analyzes IMU rehabilitation sessions in a desktop window.
          EOF
          sed -i 's/^          //' package/DEBIAN/control
          cat > package/usr/share/applications/retrack.desktop <<EOF
          [Desktop Entry]
          Type=Application
          Name=ReTrack
          Comment=IMU rehabilitation tracking desktop app
          Exec=/opt/retrack/ReTrack
          Terminal=false
          Categories=Science;MedicalSoftware;
          EOF
          sed -i 's/^          //' package/usr/share/applications/retrack.desktop
          dpkg-deb --build package "${{ matrix.archive_name }}"

      - name: Package macOS dmg
        if: runner.os == 'macOS'
        run: hdiutil create -volname ReTrack -srcfolder "${{ matrix.dist_path }}" -ov -format UDZO "${{ matrix.archive_name }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.archive_name }}
          if-no-files-found: error

      - name: Attach artifact to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive_name }}
