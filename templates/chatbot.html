
  <!-- ===================== CHATBOT AI MODAL (Full Screen) ===================== -->
  <style>
    /* === Overlay === */
    #cbOverlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: rgba(5, 12, 20, 0.82);
      backdrop-filter: blur(12px);
      align-items: center;
      justify-content: center;
    }

    #cbOverlay.open {
      display: flex;
    }

    /* === Main box === */
    #cbBox {
      width: 92vw;
      max-width: 1280px;
      height: 88vh;
      background: #0d1b2a;
      border: 1px solid #1a3347;
      border-radius: 20px;
      display: flex;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(77, 195, 255, 0.06);
      animation: cbSlideIn 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes cbSlideIn {
      from {
        opacity: 0;
        transform: scale(0.96) translateY(16px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    /* === Sidebar === */
    #cbSidebar {
      width: 260px;
      flex-shrink: 0;
      background: #071320;
      border-right: 1px solid #152d3f;
      display: flex;
      flex-direction: column;
      padding: 16px 12px;
      gap: 8px;
      transition: width 0.3s cubic-bezier(0.2, 0, 0, 1), padding 0.3s, opacity 0.3s;
      overflow: hidden;
    }

    #cbSidebar.collapsed {
      width: 0;
      padding-left: 0;
      padding-right: 0;
      border-right: none;
      opacity: 0;
    }

    #cbSidebarHeader {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 4px 4px 8px;
      border-bottom: none;
      margin-bottom: 4px;
    }

    .cb-logo-orb {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      flex-shrink: 0;
      background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2 60%, #164e63);
      box-shadow: 0 0 12px rgba(8, 145, 178, 0.5);
    }

    #cbSidebarHeader h6 {
      margin: 0;
      color: #e0f2fe;
      font-size: 13px;
      font-weight: 700;
    }

    #cbNewChatBtn {
      width: 100%;
      background: rgba(8, 145, 178, 0.15);
      border: 1px solid rgba(8, 145, 178, 0.3);
      color: #67e8f9;
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-align: left;
      transition: background 0.18s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #cbNewChatBtn:hover {
      background: rgba(8, 145, 178, 0.28);
    }

    #cbHistoryList {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    #cbHistoryList::-webkit-scrollbar {
      width: 3px;
    }

    #cbHistoryList::-webkit-scrollbar-thumb {
      background: #1a3347;
      border-radius: 3px;
    }

    .cb-hist-item {
      display: flex;
      align-items: center;
      gap: 6px;
      padding: 8px 10px;
      border-radius: 9px;
      cursor: pointer;
      color: #8ab4c9;
      font-size: 12.5px;
      transition: background 0.15s;
      border: 1px solid transparent;
    }

    .cb-hist-item:hover {
      background: rgba(255, 255, 255, 0.04);
      color: #c9e8f5;
    }

    .cb-hist-item.active {
      background: rgba(8, 145, 178, 0.15);
      border-color: rgba(8, 145, 178, 0.3);
      color: #e0f2fe;
    }

    .cb-hist-title {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .cb-hist-del {
      background: none;
      border: none;
      color: #3a6a88;
      padding: 2px 5px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 14px;
      line-height: 1;
      flex-shrink: 0;
      transition: color 0.15s, background 0.15s;
    }

    .cb-hist-del:hover {
      color: #f87171;
      background: rgba(248, 113, 113, 0.1);
    }

    #cbSidebarFooter {
      border-top: 1px solid #152d3f;
      padding-top: 10px;
      font-size: 11px;
      color: #3a6a88;
      text-align: center;
    }

    /* === Right panel === */
    #cbRight {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* Header */
    #cbHeader {
      background: linear-gradient(135deg, #0f2d45 0%, #0d2233 100%);
      border-bottom: 1px solid #1a3347;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .cb-hdr-orb {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2 60%, #164e63);
      box-shadow: 0 0 16px rgba(8, 145, 178, 0.45);
      animation: cbOrbFloat 3s ease-in-out infinite;
      flex-shrink: 0;
    }

    @keyframes cbOrbFloat {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-4px);
      }
    }

    #cbHeader h5 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #e0f2fe;
    }

    #cbHeader p {
      margin: 0;
      font-size: 11.5px;
      color: #5b8fa8;
    }

    #cbUserBadge {
      margin-left: auto;
      color: #67e8f9;
      font-size: 12.5px;
      font-weight: 600;
      background: rgba(8, 145, 178, 0.12);
      border: 1px solid rgba(8, 145, 178, 0.25);
      padding: 5px 14px;
      border-radius: 20px;
    }

    #cbCloseBtn {
      background: none;
      border: none;
      color: #5b8fa8;
      font-size: 22px;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 8px;
      transition: background 0.15s, color 0.15s;
      line-height: 1;
    }

    #cbCloseBtn:hover {
      background: rgba(255, 255, 255, 0.06);
      color: #fff;
    }

    /* Name screen */
    #cbNameScreen {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 60px;
      gap: 16px;
    }

    .cb-name-orb {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2 60%, #164e63);
      box-shadow: 0 12px 32px rgba(8, 145, 178, 0.4);
      margin-bottom: 4px;
    }

    #cbNameScreen h3 {
      color: #e0f2fe;
      font-size: 22px;
      font-weight: 800;
      margin: 0;
    }

    #cbNameScreen p {
      color: #5b8fa8;
      font-size: 14px;
      margin: 0;
      text-align: center;
      max-width: 36ch;
    }

    #cbNameInp {
      width: 100%;
      max-width: 380px;
      border: 1.5px solid #1a3347;
      border-radius: 12px;
      padding: 12px 18px;
      font-size: 15px;
      background: #071320;
      color: #d0eaf8;
      outline: none;
      transition: border-color 0.2s;
    }

    #cbNameInp:focus {
      border-color: #0891b2;
    }

    #cbNameInp::placeholder {
      color: #2d5a75;
    }

    #cbStartBtn {
      width: 100%;
      max-width: 380px;
      background: linear-gradient(135deg, #0891b2, #0e7490);
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    #cbStartBtn:hover {
      opacity: 0.88;
    }

    /* Messages */
    #cbMessages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 28px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      background: #0a1624;
    }

    #cbMessages::-webkit-scrollbar {
      width: 4px;
    }

    #cbMessages::-webkit-scrollbar-thumb {
      background: #1a3347;
      border-radius: 4px;
    }

    .cb-row {
      display: flex;
      align-items: flex-end;
      gap: 10px;
      animation: cbFadeUp 0.22s ease;
    }

    @keyframes cbFadeUp {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .cb-row.user {
      flex-direction: row-reverse;
    }

    .cb-bbl {
      max-width: 68%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.65;
      word-break: break-word;
    }

    .cb-bbl.bot {
      background: #112840;
      color: #c9e8f5;
      border: 1px solid #1d3f5a;
      border-bottom-left-radius: 4px;
    }

    .cb-bbl.user {
      background: linear-gradient(135deg, #0891b2, #0e7490);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .cb-av {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      flex-shrink: 0;
      background: radial-gradient(circle at 35% 35%, #67e8f9, #0891b2);
    }

    .cb-typing {
      background: #112840;
      border: 1px solid #1d3f5a;
      border-radius: 18px;
      border-bottom-left-radius: 4px;
      padding: 14px 18px;
      display: flex;
      gap: 5px;
      align-items: center;
    }

    .cb-dot {
      width: 6px;
      height: 6px;
      background: #0891b2;
      border-radius: 50%;
      animation: cbBounce 1.1s infinite;
    }

    .cb-dot:nth-child(2) {
      animation-delay: .18s;
    }

    .cb-dot:nth-child(3) {
      animation-delay: .36s;
    }

    @keyframes cbBounce {

      0%,
      80%,
      100% {
        transform: translateY(0);
      }

      40% {
        transform: translateY(-6px);
      }
    }

    /* Suggestion chips */
    .cb-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      padding: 4px 0 10px;
    }

    .cb-chip {
      background: rgba(8, 145, 178, 0.1);
      border: 1px solid rgba(8, 145, 178, 0.3);
      color: #67e8f9;
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 12.5px;
      cursor: pointer;
      transition: background 0.18s, border-color 0.18s;
      white-space: nowrap;
    }

    .cb-chip:hover {
      background: rgba(8, 145, 178, 0.25);
      border-color: #0891b2;
      color: #fff;
    }

    .cb-chip.contrib {
      background: rgba(16, 185, 129, 0.08);
      border-color: rgba(16, 185, 129, 0.3);
      color: #34d399;
    }

    .cb-chip.contrib:hover {
      background: rgba(16, 185, 129, 0.22);
      border-color: #10b981;
      color: #fff;
    }

    /* Markdown */
    .cb-bbl.bot h1,
    .cb-bbl.bot h2,
    .cb-bbl.bot h3,
    .cb-bbl.bot h4 {
      margin: 10px 0 6px;
      color: #4dc3ff;
      font-size: 14px;
    }

    .cb-bbl.bot h1:first-child,
    .cb-bbl.bot h2:first-child,
    .cb-bbl.bot h3:first-child {
      margin-top: 0;
    }

    .cb-bbl.bot p {
      margin-bottom: 6px;
    }

    .cb-bbl.bot p:last-child {
      margin-bottom: 0;
    }

    .cb-bbl.bot ul,
    .cb-bbl.bot ol {
      margin: 4px 0 8px;
      padding-left: 20px;
    }

    .cb-bbl.bot li {
      margin-bottom: 3px;
    }

    .cb-bbl.bot strong {
      color: #7dd3fc;
    }

    /* Input bar */
    #cbInputBar {
      padding: 14px 20px;
      background: #0b1e2e;
      border-top: 1px solid #1a3347;
      display: flex;
      align-items: flex-end;
      gap: 10px;
      flex-shrink: 0;
    }

    #cbInput {
      flex: 1;
      border: 1.5px solid #1a3347;
      border-radius: 14px;
      padding: 12px 16px;
      font-size: 14px;
      background: #071320;
      color: #d0eaf8;
      outline: none;
      resize: none;
      min-height: 48px;
      max-height: 140px;
      font-family: 'Inter', sans-serif;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    #cbInput:focus {
      border-color: #0891b2;
    }

    #cbInput::placeholder {
      color: #2d5a75;
    }

    #cbSendBtn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      flex-shrink: 0;
      background: linear-gradient(135deg, #0891b2, #0e7490);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: opacity 0.15s, transform 0.12s;
    }

    #cbSendBtn:hover {
      opacity: 0.88;
    }

    #cbSendBtn:active {
      transform: scale(0.92);
    }

    #cbSendBtn svg {
      width: 18px;
      height: 18px;
      fill: white;
    }

    #cbInputHint {
      font-size: 11px;
      color: #2d5a75;
      margin-top: 4px;
      text-align: right;
    }
  </style>

  <div id="cbOverlay">
    <div id="cbBox">
      <!-- Sidebar -->
      <div id="cbSidebar">
        <div id="cbSidebarHeader">
          <button class="cb-toggle-btn" onclick="cbToggleSidebar()"
            style="background: transparent; border: 1px solid #3a6a88; border-radius: 50%; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; color: #e0f2fe; cursor: pointer; transition: background 0.2s;">
            <i class="bi bi-list" style="font-size: 20px;"></i>
          </button>
        </div>
        <button id="cbNewChatBtn" onclick="cbNewChat()">
          <i class="bi bi-plus-circle"></i> Cuộc hội thoại mới
        </button>
        <div id="cbHistoryList"></div>
        <div id="cbSidebarFooter">Lịch sử lưu trên thiết bị này</div>
      </div>

      <!-- Right panel -->
      <div id="cbRight">
        <!-- Header -->
        <div id="cbHeader">
          <button id="cbOpenSidebarBtn" onclick="cbToggleSidebar()"
            style="display:none; background:transparent; border:1px solid #3a6a88; border-radius:50%; width:36px; height:36px; align-items:center; justify-content:center; color:#e0f2fe; cursor:pointer; transition:background 0.2s; margin-right:8px;">
            <i class="bi bi-list" style="font-size: 20px;"></i>
          </button>
          <div class="cb-hdr-orb"></div>
          <div>
            <h5>imurTrack AI <span id="cbSessionLabel" style="color:#5b8fa8; font-weight:400; font-size:13px;"></span>
            </h5>
            <p>Trợ lý AI hỗ trợ về dự án ReTrack</p>
          </div>
          <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;" id="cbUserContainer">
            <span id="cbUserBadge" style="display:none; margin-left: 0;"></span>
            <button id="cbLogoutBtn" onclick="cbLogout()"
              style="display:none; background:none; border:none; color:#e0f2fe; font-size:18px; cursor:pointer;"
              title="Đăng xuất khỏi AI">
              <i class="bi bi-box-arrow-right"></i>
            </button>
          </div>
          <button id="cbCloseBtn" onclick="cbClose()">✕</button>
        </div>

        <!-- Name screen -->
        <div id="cbNameScreen">
          <div class="cb-name-orb"></div>
          <h3>Xin chào! </h3>
          <p>Hãy cho mình biết tên của bạn để bắt đầu trò chuyện</p>
          <input id="cbNameInp" type="text" placeholder="Tên của bạn..." maxlength="40" />
          <button id="cbStartBtn" onclick="cbBegin()">Bắt đầu trò chuyện</button>
        </div>

        <!-- Chat screen -->
        <div id="cbChatScreen" style="display:none; flex:1; flex-direction:column; overflow:hidden;">
          <div id="cbMessages"></div>
          <div id="cbInputBar">
            <div style="flex:1; display:flex; flex-direction:column; gap:4px;">
              <textarea id="cbInput" rows="1"
                placeholder="Nhập câu hỏi về ReTrack... (Enter để gửi, Shift+Enter xuống dòng)"></textarea>
              <div id="cbInputHint">Enter ↵ gửi &nbsp;·&nbsp; Shift+Enter xuống dòng</div>
            </div>
            <button id="cbSendBtn" onclick="cbSend()">
              <svg viewBox="0 0 24 24">
                <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    (function () {
      // ── Storage helpers ────────────────────────────────
      var CB_NAME_KEY = 'cbUserName';
      var CB_CONVS_KEY = 'cbConversations';

      function saveName(n) { localStorage.setItem(CB_NAME_KEY, n); }
      function loadName() { return localStorage.getItem(CB_NAME_KEY) || ''; }
      function saveConvs(c) { localStorage.setItem(CB_CONVS_KEY, JSON.stringify(c)); }
      function loadConvs() {
        try { return JSON.parse(localStorage.getItem(CB_CONVS_KEY) || '[]'); }
        catch (e) { return []; }
      }

      // ── State ──────────────────────────────────────────
      var _name = '';
      var _convs = [];   // [{id, title, msgs:[{role:'user'|'bot', text}]}]
      var _activeId = null;

      function activeConv() {
        return _convs.find(function (c) { return c.id === _activeId; }) || null;
      }

      // ── Suggestions ───────────────────────────────────
      var SUGGESTIONS = [
        { label: ' ReTrack là gì?', text: 'ReTrack là gì? Giới thiệu tôi nghe về sản phẩm này.' },
        { label: ' Cách sử dụng', text: 'Hướng dẫn cách sử dụng thiết bị ReTrack?' },
        { label: ' Dữ liệu đo', text: 'Thiết bị đo dữ liệu gì? Góc khớp, EMG là gì?' },
        { label: ' Nhóm phát triển', text: 'Nhóm phát triển dự án ReTrack gồm những ai?' },
        { label: ' Ứng dụng y tế', text: 'ReTrack ứng dụng trong phục hồi chức năng như thế nào?' },
        { label: ' Biểu đồ & chỉ số', text: 'Biểu đồ góc khớp và EMG cho biết điều gì?' },
        { label: ' Góp ý / Dạy AI', text: 'Mình muốn chia sẻ thêm thông tin để giúp AI học hỏi.', contrib: true }
      ];

      // ── Open / Close ──────────────────────────────────
      function loadClinicalContext() {
        try { return JSON.parse(localStorage.getItem('ai_clinical_context') || '{}'); }
        catch (e) { return {}; }
      }

      function loadClinicalConclusion() {
        try { return localStorage.getItem('ai_clinical_conclusion') || ''; }
        catch (e) { return ''; }
      }

      window.openChatbotModal = function () {
        _name = loadName();
        _convs = loadConvs();
        document.getElementById('cbOverlay').classList.add('open');
        if (_name) {
          cbShowChat();
        } else {
          document.getElementById('cbNameScreen').style.display = '';
          document.getElementById('cbChatScreen').style.display = 'none';
          setTimeout(function () { document.getElementById('cbNameInp').focus(); }, 120);
        }
      };
      window.cbClose = function () {
        document.getElementById('cbOverlay').classList.remove('open');
      };
      // backdrop click
      document.getElementById('cbOverlay').addEventListener('click', function (e) {
        if (e.target === this) window.cbClose();
      });

      // Toggle Sidebar
      window.cbToggleSidebar = function () {
        var sb = document.getElementById('cbSidebar');
        var openBtn = document.getElementById('cbOpenSidebarBtn');
        if (sb.classList.contains('collapsed')) {
          sb.classList.remove('collapsed');
          openBtn.style.display = 'none';
        } else {
          sb.classList.add('collapsed');
          openBtn.style.display = 'flex';
        }
      };

      // ── Begin with name ───────────────────────────────
      window.cbBegin = function () {
        var v = document.getElementById('cbNameInp').value.trim();
        if (!v) { document.getElementById('cbNameInp').focus(); return; }
        _name = v;
        saveName(_name);
        cbShowChat();
      };
      document.getElementById('cbNameInp').addEventListener('keydown', function (e) {
        if (e.key === 'Enter') cbBegin();
      });

      function cbShowChat() {
        document.getElementById('cbNameScreen').style.display = 'none';
        var cs = document.getElementById('cbChatScreen');
        cs.style.display = 'flex'; cs.style.flexDirection = 'column';
        cs.style.overflow = 'hidden'; cs.style.flex = '1';
        document.getElementById('cbUserBadge').style.display = '';
        document.getElementById('cbUserBadge').textContent = _name;
        document.getElementById('cbLogoutBtn').style.display = 'block';
        cbRenderHistory();
        if (_convs.length === 0) {
          cbNewChat();
        } else {
          cbLoadConv(_convs[0].id);
        }
        var context = loadClinicalContext();
        var conclusion = loadClinicalConclusion();
        if (context && (context.patient_code || context.exercise_name || context.vas_before !== null || context.vas_after !== null)) {
          var ctxText = '**Ngữ cảnh phân tích:** ' + [context.patient_code ? ('Mã bệnh nhân: ' + context.patient_code) : '', context.exercise_name ? ('Bài tập: ' + context.exercise_name) : '', context.vas_before !== null ? ('VAS trước: ' + context.vas_before) : '', context.vas_after !== null ? ('VAS sau: ' + context.vas_after) : ''].filter(Boolean).join(' | ');
          cbAddMsg(ctxText, 'bot', false);
        }
        if (conclusion) {
          cbAddMsg('### Toàn bộ kết quả phân tích lâm sàng\n\n' + conclusion, 'bot', false);
        }
      }

      // ── Logout ───────────────────────────────────────
      window.cbLogout = function () {
        if (!confirm("Bạn có chắc muốn đăng xuất tài khoản AI hiện tại?")) return;
        localStorage.removeItem(CB_NAME_KEY);
        _name = '';
        document.getElementById('cbUserBadge').style.display = 'none';
        document.getElementById('cbLogoutBtn').style.display = 'none';
        document.getElementById('cbNameInp').value = '';
        document.getElementById('cbNameScreen').style.display = 'flex';
        document.getElementById('cbChatScreen').style.display = 'none';
      };

      // ── New chat ──────────────────────────────────────
      window.cbNewChat = function () {
        _name = loadName() || _name;
        _convs = loadConvs();
        var id = 'conv_' + Date.now();
        var conv = { id: id, title: 'Cuộc trò chuyện mới', msgs: [] };
        _convs.unshift(conv);
        saveConvs(_convs);
        _activeId = id;
        cbRenderHistory();
        cbRenderMessages();
        // Show welcome + suggestions
        cbAddMsg('Xin chào **' + _name + '**! Mình là **imurTrack AI**, trợ lý của dự án ReTrack. Mình có thể giúp gì cho bạn? ⸜(｡˃ ᵕ ˂)⸝♡', 'bot', false);
        cbShowSuggestions();
        setTimeout(function () { document.getElementById('cbInput').focus(); }, 100);
      };

      // ── Load existing conversation ────────────────────
      function cbLoadConv(id) {
        _activeId = id;
        cbRenderHistory();
        cbRenderMessages();
        // If empty, show welcome
        var conv = activeConv();
        if (conv && conv.msgs.length === 0) {
          cbAddMsg('Xin chào **' + _name + '**! Mình là **imurTrack AI**, trợ lý của dự án ReTrack. Mình có thể giúp gì cho bạn? ⸜(｡˃ ᵕ ˂)⸝♡', 'bot', false);
          cbShowSuggestions();
        }
        setTimeout(function () { document.getElementById('cbInput').focus(); }, 100);
      }

      // ── Delete conversation ───────────────────────────
      window.cbDelConv = function (id, e) {
        e.stopPropagation();
        _convs = _convs.filter(function (c) { return c.id !== id; });
        saveConvs(_convs);
        if (_activeId === id) {
          _activeId = null;
          if (_convs.length > 0) { cbLoadConv(_convs[0].id); }
          else { cbNewChat(); }
        }
        cbRenderHistory();
      };

      // ── Render sidebar ────────────────────────────────
      function cbRenderHistory() {
        var list = document.getElementById('cbHistoryList');
        _convs = loadConvs();
        if (_convs.length === 0) {
          list.innerHTML = '<div style="font-size:12px; color:#2d5a75; padding:8px 10px;">Chưa có hội thoại nào</div>';
          return;
        }
        list.innerHTML = _convs.map(function (c) {
          var cls = c.id === _activeId ? 'active' : '';
          return '<div class="cb-hist-item ' + cls + '" onclick="cbLoadConv(\'' + c.id + '\')">' +
            '<i class="bi bi-chat-text" style="font-size:13px; flex-shrink:0;"></i>' +
            '<span class="cb-hist-title">' + escHtml(c.title) + '</span>' +
            '<button class="cb-hist-del" onclick="cbDelConv(\'' + c.id + '\',event)" title="Xóa">✕</button>' +
            '</div>';
        }).join('');
      }

      // ── Render messages ───────────────────────────────
      function cbRenderMessages() {
        var msgs = document.getElementById('cbMessages');
        msgs.innerHTML = '';
        var conv = activeConv();
        if (!conv) return;
        conv.msgs.forEach(function (m) {
          appendMsgEl(m.role, m.text);
        });
        msgs.scrollTop = msgs.scrollHeight;
      }

      function appendMsgEl(role, text) {
        var msgs = document.getElementById('cbMessages');
        var row = document.createElement('div');
        row.className = 'cb-row ' + role;
        if (role === 'bot') {
          var html = (typeof marked !== 'undefined') ? marked.parse(text) : text;
          row.innerHTML = '<div class="cb-av"></div><div class="cb-bbl bot">' + html + '</div>';
        } else {
          row.innerHTML = '<div class="cb-bbl user">' + escHtml(text) + '</div>';
        }
        msgs.appendChild(row);
        msgs.scrollTop = msgs.scrollHeight;
      }

      // Add message to state + DOM
      function cbAddMsg(text, role, save) {
        if (save === undefined) save = true;
        appendMsgEl(role, text);
        if (save && activeConv()) {
          var conv = activeConv();
          conv.msgs.push({ role: role, text: text });
          // Update title from first user message
          if (role === 'user' && conv.title === 'Cuộc trò chuyện mới') {
            conv.title = text.substring(0, 40);
          }
          saveConvs(_convs);
          cbRenderHistory();
        }
      }

      // ── Suggestions ───────────────────────────────────
      function cbShowSuggestions() {
        var msgs = document.getElementById('cbMessages');
        var row = document.createElement('div');
        row.className = 'cb-row bot'; row.id = 'cb-sug-row';
        var html = '<div class="cb-chips">';
        SUGGESTIONS.forEach(function (s, i) {
          var cls = s.contrib ? 'cb-chip contrib' : 'cb-chip';
          html += '<button class="' + cls + '" onclick="cbChip(' + i + ')">' + s.label + '</button>';
        });
        html += '</div>';
        row.innerHTML = '<div class="cb-av"></div><div class="cb-bbl bot" style="max-width:85%; padding:10px 14px;">' +
          '<div style="font-size:12px; color:#5b8fa8; margin-bottom:8px;">✨ Một số chủ đề bạn có thể hỏi:</div>' + html + '</div>';
        msgs.appendChild(row);
        msgs.scrollTop = msgs.scrollHeight;
      }

      window.cbChip = function (i) {
        var sug = document.getElementById('cb-sug-row');
        if (sug) sug.remove();
        document.getElementById('cbInput').value = SUGGESTIONS[i].text;
        cbSend();
      };

      // ── Send ──────────────────────────────────────────
      window.cbSend = function () {
        var inp = document.getElementById('cbInput');
        var text = inp.value.trim();
        if (!text) return;
        inp.value = ''; inp.style.height = 'auto';
        var sug = document.getElementById('cb-sug-row');
        if (sug) sug.remove();
        cbAddMsg(text, 'user');
        cbShowTyping();

        var xhr = new XMLHttpRequest();
        xhr.open('POST', '/api/chat', true);
        xhr.setRequestHeader('Content-Type', 'application/json');
        xhr.onreadystatechange = function () {
          if (xhr.readyState === 4) {
            cbHideTyping();
            var ans;
            if (xhr.status === 200) {
              try { ans = JSON.parse(xhr.responseText).answer || 'Không có phản hồi.'; }
              catch (e) { ans = 'Lỗi phân tích phản hồi.'; }
            } else {
              ans = 'Ôi, có lỗi rồi! Vui lòng thử lại nhé. ₍^. .^₎Ⳋ';
            }
            cbAddMsg(ans, 'bot');
          }
        };
        xhr.send(JSON.stringify({ message: text }));
      };

      // ── Typing indicator ─────────────────────────────
      function cbShowTyping() {
        var msgs = document.getElementById('cbMessages');
        var row = document.createElement('div');
        row.className = 'cb-row bot'; row.id = 'cb-typing';
        row.innerHTML = '<div class="cb-av"></div><div class="cb-typing"><div class="cb-dot"></div><div class="cb-dot"></div><div class="cb-dot"></div></div>';
        msgs.appendChild(row);
        msgs.scrollTop = msgs.scrollHeight;
      }
      function cbHideTyping() {
        var t = document.getElementById('cb-typing');
        if (t) t.remove();
      }

      // ── Input auto-resize + keyboard ──────────────────
      document.getElementById('cbInput').addEventListener('input', function () {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 140) + 'px';
      });
      document.getElementById('cbInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); cbSend(); }
      });

      // ── Expose global load conv ───────────────────────
      window.cbLoadConv = cbLoadConv;

      // ── Util ─────────────────────────────────────────
      function escHtml(s) {
        return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
      }
    })();
  </script>
