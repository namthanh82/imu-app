<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ImurTrack AI</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', sans-serif;
      background: #f8f6ff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(120, 80, 200, 0.18);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      backdrop-filter: blur(6px);
    }

    .popup {
      background: white;
      border-radius: 24px;
      padding: 40px 36px;
      width: 340px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(140, 80, 200, 0.2);
    }

    .popup-orb {
      width: 56px;
      height: 56px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d8b4fe, #a855f7 60%, #7c3aed);
      margin: 0 auto 20px;
      box-shadow: 0 8px 24px rgba(168, 85, 247, 0.4);
    }

    .popup h2 {
      font-size: 20px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .popup p {
      font-size: 14px;
      color: #888;
      margin-bottom: 24px;
    }

    .popup input {
      width: 100%;
      border: 1.5px solid #e5d5f9;
      border-radius: 12px;
      padding: 12px 16px;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      outline: none;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .popup input:focus { border-color: #a855f7; }
    .popup input::placeholder { color: #c4a8e0; }

    .popup button {
      width: 100%;
      background: linear-gradient(135deg, #c084fc, #a855f7);
      color: white;
      border: none;
      border-radius: 12px;
      padding: 13px;
      font-size: 15px;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.15s;
    }

    .popup button:hover { opacity: 0.9; }
    .popup button:active { transform: scale(0.98); }

    .chat-wrapper {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      width: 100%;
      padding: 40px 20px;
    }

    .chat-wrapper.visible { display: flex; }

    .orb {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d8b4fe, #a855f7 60%, #7c3aed);
      box-shadow: 0 8px 28px rgba(168, 85, 247, 0.45);
      margin-bottom: 28px;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-8px); }
    }

    .greeting {
      text-align: center;
      margin-bottom: 40px;
    }

    .greeting h1 {
      font-size: 28px;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 6px;
    }

    .greeting h1 span { color: #a855f7; }

    .greeting p {
      font-size: 17px;
      color: #666;
      font-weight: 400;
    }

    .input-bar {
      width: 100%;
      max-width: 600px;
      background: white;
      border-radius: 18px;
      border: 1.5px solid #ede0ff;
      display: flex;
      align-items: center;
      padding: 14px 16px;
      gap: 10px;
      box-shadow: 0 4px 20px rgba(140, 80, 200, 0.1);
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .input-bar:focus-within {
      border-color: #c084fc;
      box-shadow: 0 4px 24px rgba(168, 85, 247, 0.18);
    }

    .input-icon {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
      opacity: 0.4;
    }

    #user-input {
      flex: 1;
      border: none;
      outline: none;
      font-size: 15px;
      font-family: 'Inter', sans-serif;
      color: #1a1a2e;
      background: transparent;
    }

    #user-input::placeholder { color: #bbb; }

    .send-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #c084fc, #a855f7);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform 0.15s, opacity 0.15s;
    }

    .send-btn:hover { opacity: 0.88; }
    .send-btn:active { transform: scale(0.94); }
    .send-btn svg { width: 16px; height: 16px; fill: white; }

    .chat-messages {
      width: 100%;
      max-width: 600px;
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      max-height: 55vh;
      overflow-y: auto;
      padding-right: 4px;
    }

    .chat-messages::-webkit-scrollbar { width: 4px; }
    .chat-messages::-webkit-scrollbar-thumb { background: #d8b4fe; border-radius: 4px; }

    .msg-row {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      animation: fadeUp 0.25s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .msg-row.user { flex-direction: row-reverse; }

    .bubble {
      max-width: 78%;
      padding: 10px 14px;
      border-radius: 16px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }

    .bubble.bot {
      background: white;
      color: #1a1a2e;
      border-bottom-left-radius: 4px;
      border: 1px solid #f0e4ff;
    }

    .markdown-body {
      font-size: 14px;
    }
    .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4 {
      margin-top: 12px;
      margin-bottom: 8px;
      color: #7c3aed;
      font-size: 16px;
    }
    .markdown-body h1:first-child, .markdown-body h2:first-child, .markdown-body h3:first-child {
      margin-top: 0;
    }
    .markdown-body p {
      margin-bottom: 8px;
    }
    .markdown-body p:last-child {
      margin-bottom: 0;
    }
    .markdown-body ul, .markdown-body ol {
      margin-top: 6px;
      margin-bottom: 10px;
      padding-left: 22px;
    }
    .markdown-body li {
      margin-bottom: 4px;
    }
    .markdown-body strong {
      color: #6d28d9;
    }

    .bubble.user {
      background: linear-gradient(135deg, #c084fc, #a855f7);
      color: white;
      border-bottom-right-radius: 4px;
    }

    .bot-mini-orb {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #d8b4fe, #a855f7);
      flex-shrink: 0;
    }

    .typing-bubble {
      background: white;
      border: 1px solid #f0e4ff;
      border-radius: 16px;
      border-bottom-left-radius: 4px;
      padding: 12px 16px;
      display: flex;
      gap: 4px;
      align-items: center;
    }

    .dot {
      width: 6px; height: 6px;
      background: #c084fc;
      border-radius: 50%;
      animation: bounce 1.1s infinite;
    }
    .dot:nth-child(2) { animation-delay: 0.18s; }
    .dot:nth-child(3) { animation-delay: 0.36s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); }
      40% { transform: translateY(-5px); }
    }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<div class="overlay" id="overlay">
  <div class="popup">
    <div class="popup-orb"></div>
    <h2>Xin chào!</h2>
    <p>Cho mình biết tên của bạn nhé</p>
    <input type="text" id="name-input" placeholder="Tên của bạn là" maxlength="30"/>
    <button onclick="startChat()">Bắt đầu trò chuyện</button>
  </div>
</div>

<div class="chat-wrapper" id="chat-wrapper">
  <div class="orb"></div>

  <div class="greeting" id="greeting">
    <h1>Xin chào, <span id="display-name">ban</span>!</h1>
    <p>Mình có thể giúp gì cho bạn về ReTrack?</p>
  </div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="input-bar">
    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="#999" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input type="text" id="user-input" placeholder="Đặt câu hỏi cho AI hoặc đưa ra yêu cầu."/>
    <button class="send-btn" id="send-btn">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>
</div>

<script>
  var userName = "";

  function startChat() {
    var val = document.getElementById("name-input").value.trim();
    if (!val) { document.getElementById("name-input").focus(); return; }
    userName = val;
    document.getElementById("display-name").textContent = userName;
    document.getElementById("overlay").style.display = "none";
    document.getElementById("chat-wrapper").classList.add("visible");
    document.getElementById("user-input").focus();
  }

  document.getElementById("name-input").addEventListener("keydown", function(e) {
    if (e.key === "Enter") startChat();
  });

  var chatMessages = document.getElementById("chat-messages");
  var inputEl = document.getElementById("user-input");
  var sendBtn = document.getElementById("send-btn");

  function hideGreeting() {
    var g = document.getElementById("greeting");
    if (g) g.style.display = "none";
  }

  function addMessage(text, sender) {
    hideGreeting();
    var row = document.createElement("div");
    row.className = "msg-row " + sender;

    if (sender === "bot") {
      var htmlContent = marked.parse(text);
      row.innerHTML =
        '<div class="bot-mini-orb"></div>' +
        '<div class="bubble bot markdown-body">' + htmlContent + '</div>';
    } else {
      row.innerHTML =
        '<div class="bubble user">' + text + '</div>';
    }

    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function showTyping() {
    hideGreeting();
    var row = document.createElement("div");
    row.className = "msg-row bot";
    row.id = "typing";
    row.innerHTML =
      '<div class="bot-mini-orb"></div>' +
      '<div class="typing-bubble">' +
      '<div class="dot"></div><div class="dot"></div><div class="dot"></div>' +
      '</div>';
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }

  function removeTyping() {
    var t = document.getElementById("typing");
    if (t) t.remove();
  }

  function sendMessage() {
    var text = inputEl.value.trim();
    if (!text) return;
    inputEl.value = "";

    addMessage(text, "user");
    showTyping();

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/chat", true);
    xhr.setRequestHeader("Content-Type", "application/json");
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        removeTyping();
        if (xhr.status === 200) {
          var data = JSON.parse(xhr.responseText);
          addMessage(data.answer, "bot");
        } else {
          addMessage("Ôi, có lỗi rồi, vui lòng thử lại!", "bot");
        }
      }
    };
    xhr.send(JSON.stringify({ message: text }));
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", function(e) {
    if (e.key === "Enter") sendMessage();
  });
</script>
</body>
</html>
